<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Cloud Storage | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-bg">

  <div class="auth-card glass">
    <h2>☁ Smart Cloud Storage</h2>
    <p class="muted">Secure & lightning-fast file storage</p>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button id="loginTab" class="active">Login</button>
      <button id="signupTab">Create Account</button>
    </div>

    <!-- Login Box -->
    <div id="loginBox">
      <div class="field">
        <input id="loginEmail" type="email" placeholder=" " />
        <label>Email Address</label>
      </div>

      <div class="field">
        <input id="loginPassword" type="password" placeholder=" " />
        <label>Password</label>
      </div>

      <button id="loginBtn" class="primary full">Sign In</button>
      <div style="margin-top: 15px;">
        <button id="forgotPwd" class="text-btn">Forgot Password?</button>
      </div>
    </div>

    <!-- Signup Box -->
    <div id="signupBox" style="display:none;">
      <div class="field">
        <input id="signupEmail" type="email" placeholder=" " />
        <label>Email Address</label>
      </div>

      <div class="field">
        <input id="signupPassword" type="password" placeholder=" " />
        <label>Password</label>
      </div>

      <p class="hint">Password must be at least 6 characters</p>

      <button id="signupBtn" class="secondary full">Create Free Account</button>
    </div>

    <p id="authMsg" class="msg"></p>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>

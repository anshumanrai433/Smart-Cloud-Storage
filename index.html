<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Cloud Storage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-bg">

  <div class="auth-card glass">
    <h2>☁ Smart Cloud Storage</h2>
    <p class="muted">Secure cloud storage for your files</p>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button id="loginTab" class="active">Login</button>
      <button id="signupTab">Create Account</button>
    </div>

    <!-- Login -->
    <div id="loginBox">
      <div class="field">
        <input id="loginEmail" type="email" required placeholder=" " />
        <label>Email</label>
      </div>

      <div class="field">
        <input id="loginPassword" type="password" required placeholder=" " />
        <label>Password</label>
      </div>

      <button id="loginBtn" class="primary full">Login</button>
    </div>

    <!-- Signup -->
    <div id="signupBox" style="display:none;">
      <div class="field">
        <input id="signupEmail" type="email" required placeholder=" " />
        <label>Email</label>
      </div>

      <div class="field">
        <input id="signupPassword" type="password" required placeholder=" " />
        <label>Password</label>
      </div>

      <p class="hint">
        Password must be at least 6 characters
      </p>

      <button id="signupBtn" class="secondary full">
        Create Account
      </button>
    </div>

    <p id="authMsg" class="msg"></p>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>

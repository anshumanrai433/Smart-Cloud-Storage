<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Cloud Storage — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-bg">

  <div class="auth-card glass">
    <h2>☁ Smart Cloud Storage</h2>
    <p class="muted">Securely store & access your files</p>

    <div class="field">
      <input id="email" type="email" required />
      <label>Email</label>
    </div>

    <div class="field">
      <input id="password" type="password" required />
      <label>Password</label>
      <span id="togglePwd">👁</span>
    </div>

    <button id="loginBtn" class="primary">Login</button>
    <button id="signupBtn" class="secondary">Create account</button>

    <p id="authMsg" class="msg"></p>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>

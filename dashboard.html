<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | Smart Cloud Storage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Header -->
<header class="topbar glass">
  <h2>☁ Smart Cloud Storage</h2>
  <button id="logoutBtn" class="danger">Logout</button>
</header>

<!-- Controls & Sorting -->
<section class="panel glass controls">
  <div>
    <button id="gridBtn" class="active">🔳 Grid</button>
    <button id="listBtn">📋 List</button>
  </div>

  <select id="sortSelect">
    <option value="date">Sort By: Date</option>
    <option value="name">Sort By: Name</option>
    <option value="size">Sort By: Size</option>
  </select>
</section>

<!-- Storage Usage -->
<section class="panel glass">
  <span id="storageText">0 MB / 15 GB</span>
  <div class="progress">
    <div id="storageBar"></div>
  </div>
</section>

<!-- Folder & Upload Tools -->
<section class="panel glass upload-panel" id="dropZone">
  <div class="folder-bar">
    <select id="folderSelect"></select>
    <button id="folderMenuBtn" title="Folder Options">⋮</button>
    <button id="newFolderBtn" class="secondary">+ New Folder</button>
  </div>
  
  <div style="display: flex; gap: 10px; align-items: center;">
    <span class="hint" style="margin: 0;">Drag & drop files or</span>
    <input type="file" id="fileInput" multiple hidden>
    <button id="uploadBtn" class="primary">⬆ Upload Files</button>
  </div>
</section>

<!-- Files Display Area -->
<section id="filesGrid" class="files-grid"></section>

<!-- FOLDER OPTIONS MODAL -->
<div id="folderModal" class="modal-backdrop">
  <div class="modal glass">
    <h3 id="modalTitle">Folder Action</h3>

    <div class="field" style="margin-top: 15px;">
      <input id="folderInput" type="text" placeholder=" " />
      <label>Rename folder to...</label>
    </div>

    <div class="modal-actions">
      <button id="confirmBtn" class="primary">Save</button>
      <button id="cancelBtn" style="background: rgba(255,255,255,0.1);">Cancel</button>
      <button id="deleteBtn" class="danger">Delete</button>
    </div>
  </div>
</div>

<div id="toast">Action Successful</div>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>

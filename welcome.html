<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified | Smart Cloud Storage</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card glass">
            <div class="check">✓</div>
            <h1 id="status-title" style="margin-bottom: 10px;">Email Verified!</h1>
            <p id="status-desc" class="muted">Congratulations! Your Smart Cloud Storage account has been verified successfully.</p>
            <p class="hint">You can now login and securely upload, download and manage your files.</p>
            <button onclick="window.location.href='index.html'" class="primary full" style="margin-top: 20px;">Proceed to Login →</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from "./js/supabase.js";

        async function verifyEmail() {
            const hash = window.location.hash;
            const params = new URLSearchParams(hash.substring(1));
            const confirmationUrl = params.get("confirmation_url");

            if (!confirmationUrl) return;

            try {
                const response = await fetch(decodeURIComponent(confirmationUrl));
                if (!response.ok) {
                    throw new Error("Verification failed");
                }
                document.getElementById("status-title").textContent = "✅ Verification Success!";
                document.getElementById("status-desc").textContent = "Your account has been activated. You can now login.";
                history.replaceState({}, "", "welcome.html");
            } catch (err) {
                document.getElementById("status-title").textContent = "❌ Verification Failed";
                document.getElementById("status-desc").textContent = "Please try the confirmation link again.";
                document.querySelector('.check').style.background = 'rgba(239, 68, 68, 0.2)';
                document.querySelector('.check').style.color = '#ef4444';
                document.querySelector('.check').textContent = '✗';
            }
        }
        verifyEmail();
    </script>
</body>
</html>
